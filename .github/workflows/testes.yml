# Roda os testes automatizados e a verificação de estilo a cada Pull Request,
# antes da revisão, como prevê o plano de testes.
name: testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt pycodestyle
      - name: Estilo (PEP 8)
        run: python -m pycodestyle accounts posts comments config
      - name: Migrações em dia
        run: python manage.py makemigrations --check --dry-run
      - name: Testes
        run: python manage.py test

  # Publica no Azure o que entrou na main, depois que os testes passam. O
  # pacote sai daqui pronto, com as dependências e os arquivos estáticos, e
  # o App Service só precisa migrar o banco e subir. Montar tudo lá a cada
  # deploy levava cerca de um minuto e meio a mais.
  publicar:
    needs: testes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Um deploy por vez: merges seguidos entram em fila, sem disputar.
    concurrency:
      group: publicar
      cancel-in-progress: false
    env:
      PYTHONPATH: .python_packages/lib/site-packages
    steps:
      - uses: actions/checkout@v4
      # A mesma versão do Python do App Service: os pacotes instalados aqui
      # rodam lá.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Dependências dentro do pacote
        run: pip install --target "$PYTHONPATH" -r requirements.txt
      - name: Arquivos estáticos dentro do pacote
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: so-para-o-collectstatic
          DJANGO_ALLOWED_HOSTS: blog.ataraxia.dev
        run: python manage.py collectstatic --noinput
      - name: Marca a versão
        run: echo "$GITHUB_SHA" > staticfiles/versao.txt
      - name: Fecha o pacote, sem o que o site não usa
        run: zip -qr "$RUNNER_TEMP/pacote.zip" . -x '.git/*' '.github/*' 'docs/*'
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ataraxia-blog
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/pacote.zip
          type: zip
          clean: true
      - name: Confere que a versão nova está no ar
        run: |
          for tentativa in $(seq 1 60); do
            no_ar=$(curl -fsS https://blog.ataraxia.dev/static/versao.txt || true)
            if [ "$no_ar" = "$GITHUB_SHA" ]; then
              echo "No ar: $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "O site não passou a servir $GITHUB_SHA em 5 minutos." >&2
          exit 1
