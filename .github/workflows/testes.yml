# Roda os testes automatizados e a verificação de estilo a cada Pull Request,
# antes da revisão, como prevê o plano de testes.
name: testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt pycodestyle
      - name: Estilo (PEP 8)
        run: python -m pycodestyle accounts posts comments config
      - name: Migrações em dia
        run: python manage.py makemigrations --check --dry-run
      - name: Testes
        run: python manage.py test

  # Publica no Azure o que entrou na main, depois que os testes passam. O
  # App Service instala as dependências; migração e collectstatic rodam no
  # comando de inicialização do próprio serviço.
  publicar:
    needs: testes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Um deploy por vez: merges seguidos entram em fila, sem disputar.
    concurrency:
      group: publicar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Marca a versão
        run: echo "$GITHUB_SHA" > static/versao.txt
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ataraxia-blog
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
      - name: Confere que a versão nova está no ar
        run: |
          for tentativa in $(seq 1 30); do
            no_ar=$(curl -fsS https://blog.ataraxia.dev/static/versao.txt || true)
            if [ "$no_ar" = "$GITHUB_SHA" ]; then
              echo "No ar: $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "O site não passou a servir $GITHUB_SHA em 5 minutos." >&2
          exit 1
