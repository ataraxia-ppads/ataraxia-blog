<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Editor de texto</title>
<link rel="stylesheet" href="wireframe.css">
<body>
<div class="tela">
  <p class="rotulo">Editor de texto, UC08 e UC09</p>

  <div class="caixa cabecalho">
    <span class="marca">Ataraxia</span>
    <span class="busca campo">Buscar por termo</span>
    <span class="botao secundario">Meus textos</span>
    <span class="botao secundario">Sair</span>
  </div>

  <div class="linha" style="margin-top:12px">
    <div class="coluna">
      <div class="caixa">
        <label class="rotulo-campo">Título</label>
        <p class="campo">Título do texto</p>
        <label class="rotulo-campo">Corpo, em markdown</label>
        <p class="campo" style="height:230px">Escreva aqui</p>
      </div>
    </div>
    <div class="lateral">
      <div class="caixa">
        <p class="secao">Publicação</p>
        <label class="rotulo-campo">Situação</label>
        <p class="campo">Rascunho</p>
        <label class="rotulo-campo">Comentários</label>
        <p class="campo"><span style="display:inline-block;width:11px;height:11px;border:2px solid #555;background:#555;box-shadow:inset 0 0 0 2px #fff;margin-right:8px;vertical-align:-1px"></span>Aceitar comentários</p>
        <p style="margin-top:14px">
          <span class="botao">Salvar rascunho</span>
        </p>
        <p style="margin-top:8px">
          <span class="botao secundario">Publicar</span>
          <span class="botao secundario">Excluir</span>
        </p>
      </div>
      <p class="nota">
        O endereço sai do título e não muda depois da primeira publicação, para
        não quebrar vínculo já divulgado. RN10.
      </p>
    </div>
  </div>
</div>
</body>
</html>
