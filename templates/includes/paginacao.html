{% if page_obj.has_other_pages %}
  <nav class="paginacao" aria-label="Páginas">
    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    <span class="paginacao-vinculos">
      {% if page_obj.has_previous %}<a class="botao secundario" href="?{% if term %}q={{ term|urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}
      {% if page_obj.has_next %}<a class="botao secundario" href="?{% if term %}q={{ term|urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Próxima {% include 'includes/seta.html' %}</a>{% endif %}
    </span>
  </nav>
{% endif %}
