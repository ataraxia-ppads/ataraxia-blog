{% load blog %}<header class="topo">
  <div class="topo-interno">
    <a class="marca" href="{% url 'posts:list' %}">{% include 'includes/marca.html' %}<span>Ataraxia</span></a>
    <form class="busca" action="{% url 'posts:list' %}" method="get" role="search">
      <svg class="icone" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="busca-termo" class="visualmente-oculto">Buscar textos</label>
      <input id="busca-termo" type="search" name="q" value="{{ term|default:'' }}" placeholder="Buscar">
    </form>
    <nav class="navegacao" aria-label="Conta">
      <button type="button" class="icone-botao" id="alternar-tema" aria-label="Alternar entre tema claro e escuro" hidden>
        <svg class="icone icone-tema-lua" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="icone icone-tema-sol" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="icone-botao" href="https://github.com/ataraxia-ppads/ataraxia-blog" aria-label="Repositório do projeto no GitHub" title="Repositório no GitHub">
        <svg class="icone preenchido" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.57 2.34 1.12 2.91.85.09-.66.35-1.12.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.72 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.46.1 2.72.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.25 10.25 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z"/></svg>
      </a>
      {% if user.is_authenticated %}
        <a class="botao" href="{% url 'posts:create' %}">Escrever</a>
        <details class="menu">
          <summary aria-label="Abrir o menu da conta"><span class="avatar pequeno" aria-hidden="true">{{ user.profile|initials }}</span></summary>
          <div class="menu-lista">
            <a href="{{ user.profile.get_absolute_url }}" aria-label="Perfil de {{ user.profile }}">Perfil</a>
            <a href="{% url 'posts:mine' %}">Meus textos</a>
            {% if user.is_staff %}<a href="{% url 'admin:index' %}">Moderação</a>{% endif %}
            <form action="{% url 'accounts:logout' %}" method="post">
              {% csrf_token %}<button type="submit">Sair</button>
            </form>
          </div>
        </details>
      {% else %}
        <a href="{% url 'accounts:login' %}?next={{ request.path|urlencode }}">Entrar</a>
        <a class="botao" href="{% url 'accounts:signup' %}">Cadastrar-se</a>
      {% endif %}
    </nav>
  </div>
</header>
